<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: #fff5f5;
        }

        /* Morphing Background */
        .bg-blobs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(80px);
            background: linear-gradient(45deg, #ffafbd, #ffc3a0);
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: #ff4d6d;
            border-radius: 50%;
            animation: morph 15s infinite alternate ease-in-out;
            opacity: 0.6;
        }

        .blob:nth-child(2) {
            background: #ff758f;
            right: -100px;
            top: -100px;
            animation-delay: -5s;
        }

        .blob:nth-child(3) {
            background: #ffb3c1;
            left: -100px;
            bottom: -100px;
            animation-delay: -10s;
        }

        @keyframes morph {
            0% { border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%; transform: translate(0, 0) rotate(0deg); }
            33% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; transform: translate(50px, 100px) rotate(90deg); }
            66% { border-radius: 30% 70% 70% 30% / 50% 40% 30% 60%; transform: translate(-50px, 50px) rotate(180deg); }
            100% { border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%; transform: translate(0, 0) rotate(360deg); }
        }

        .glass {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(255, 77, 109, 0.37);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .cursive {
            font-family: 'Dancing Script', cursive;
        }

        .no-btn {
            position: relative;
            transition: all 0.2s ease;
        }

        .heart-float {
            position: absolute;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        .hidden-section {
            display: none;
        }

        .option-btn {
            transition: all 0.3s ease;
        }
        .option-btn:hover {
            transform: scale(1.1);
            background: #ff4d6d;
            color: white;
        }

        /* Meme Animation */
        .meme-text {
            animation: scream 0.5s infinite alternate;
        }

        @keyframes scream {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.2) rotate(2deg); }
        }

        .happy-shake {
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <!-- Main Card -->
    <div id="main-card" class="glass p-8 md:p-12 text-center max-w-lg w-11/12 transform transition-all duration-500">
        
        <!-- Question 1 -->
        <div id="q1-content">
            <h1 class="text-4xl md:text-5xl font-bold text-rose-600 mb-4 cursive">Hey Beautiful... ❤️</h1>
            <p class="text-gray-700 text-lg mb-8">Kya tum is Valentine meri partner banogi?</p>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <button id="yes-btn-1" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-10 rounded-full shadow-lg transform transition-transform active:scale-95 text-xl">
                    Haan! 😍
                </button>
                <button id="no-btn-1" class="no-btn bg-gray-200 text-gray-700 font-bold py-3 px-10 rounded-full shadow-md text-xl">
                    Nahi 🥺
                </button>
            </div>
        </div>

        <!-- Question 2 -->
        <div id="q2-content" class="hidden-section">
            <h1 class="text-4xl md:text-5xl font-bold text-rose-600 mb-4 cursive">Sachi? 🙈</h1>
            <p class="text-gray-700 text-lg mb-8">Toh phir... ek kiss karoge? 💋</p>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <button id="yes-btn-2" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-10 rounded-full shadow-lg transform transition-transform active:scale-95 text-xl">
                    Bilkul! 😘
                </button>
                <button id="no-btn-2" class="no-btn bg-gray-200 text-gray-700 font-bold py-3 px-10 rounded-full shadow-md text-xl">
                    Nahi 🤭
                </button>
            </div>
        </div>

        <!-- Question 3: Kiss Position -->
        <div id="q3-content" class="hidden-section">
            <h1 class="text-4xl md:text-5xl font-bold text-rose-600 mb-4 cursive">Hehe... Toh kahan? 😚</h1>
            <p class="text-gray-700 text-lg mb-8">Choose your favorite spot!</p>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <button onclick="goToMeme('Forehead')" class="option-btn bg-white border-2 border-rose-300 text-rose-600 font-bold py-4 px-2 rounded-2xl shadow-sm">
                    <span class="block text-3xl mb-1">😇</span> Forehead
                </button>
                <button onclick="goToMeme('Cheek')" class="option-btn bg-white border-2 border-rose-300 text-rose-600 font-bold py-4 px-2 rounded-2xl shadow-sm">
                    <span class="block text-3xl mb-1">😊</span> Cheek
                </button>
                <button onclick="goToMeme('Lips')" class="option-btn bg-white border-2 border-rose-300 text-rose-600 font-bold py-4 px-2 rounded-2xl shadow-sm">
                    <span class="block text-3xl mb-1">💋</span> Lips
                </button>
            </div>
        </div>

        <!-- Question 4: The Meme Page -->
        <div id="meme-content" class="hidden-section">
            <div class="happy-shake">
                <h1 class="text-6xl font-black text-rose-600 mb-4 meme-text">YEAHHHHH!!!</h1>
                <p class="text-2xl text-rose-500 font-bold mb-6">FIIIIINALLY! 😍🔥</p>
                <div class="flex justify-center mb-6">
                    <!-- Placeholder for Meme Style Visual -->
                    <div class="relative w-48 h-48 bg-yellow-400 rounded-full flex items-center justify-center border-8 border-white shadow-2xl">
                        <span class="text-8xl">🤩</span>
                        <div class="absolute -top-4 -right-4 text-4xl">✨</div>
                        <div class="absolute -bottom-4 -left-4 text-4xl">✨</div>
                    </div>
                </div>
            </div>
            <button onclick="showFinal()" class="mt-4 bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all animate-pulse">
                Aage Dekho! 👉
            </button>
        </div>

        <!-- Final Success Message -->
        <div id="success-content" class="hidden-section">
            <h1 class="text-5xl font-bold text-rose-600 mb-4 cursive">Perfect Choice! 🥰</h1>
            <p id="final-msg" class="text-gray-700 text-lg mb-4">You just made my day! I love you! ❤️</p>
            <div class="text-6xl animate-bounce">❤️💋🔥✨</div>
            <p class="mt-6 text-sm italic text-rose-400">Lock the date: 14th Feb 🌹</p>
        </div>
    </div>

    <script>
        const noBtn1 = document.getElementById('no-btn-1');
        const noBtn2 = document.getElementById('no-btn-2');
        const yesBtn1 = document.getElementById('yes-btn-1');
        const yesBtn2 = document.getElementById('yes-btn-2');
        
        const q1Content = document.getElementById('q1-content');
        const q2Content = document.getElementById('q2-content');
        const q3Content = document.getElementById('q3-content');
        const memeContent = document.getElementById('meme-content');
        const successContent = document.getElementById('success-content');

        let selectedSpot = "";

        // Function to move "No" button
        function moveNoButton(btn) {
            const maxX = window.innerWidth - btn.offsetWidth - 20;
            const maxY = window.innerHeight - btn.offsetHeight - 20;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            btn.style.position = 'fixed';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
            btn.style.zIndex = '999';
        }

        // Dodge logic for "No" buttons
        [noBtn1, noBtn2].forEach(btn => {
            btn.addEventListener('mouseover', () => moveNoButton(btn));
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                moveNoButton(btn);
            });
        });

        // Flow Management
        yesBtn1.addEventListener('click', () => {
            q1Content.style.display = 'none';
            q2Content.style.display = 'block';
            noBtn1.style.display = 'none'; 
        });

        yesBtn2.addEventListener('click', () => {
            q2Content.style.display = 'none';
            q3Content.style.display = 'block';
            noBtn2.style.display = 'none';
        });

        function goToMeme(choice) {
            selectedSpot = choice;
            q3Content.style.display = 'none';
            memeContent.style.display = 'block';
            
            // Initial burst of hearts for the meme page
            for(let i = 0; i < 40; i++) {
                setTimeout(createHeart, i * 30);
            }
        }

        function showFinal() {
            memeContent.style.display = 'none';
            successContent.style.display = 'block';
            document.getElementById('final-msg').innerText = selectedSpot + " kiss... You just made my day! I love you! ❤️";
            
            // Final celebration
            setInterval(createHeart, 200);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-float');
            heart.innerHTML = ['❤️', '💖', '💝', '💕', '🌹', '💋', '😘', '✨', '🔥'][Math.floor(Math.random() * 9)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '-50px';
            heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        window.onload = () => {
            setInterval(createHeart, 2500);
        };
    </script>
</body>
</html>
